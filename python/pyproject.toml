[project]
name = "gyara"
version = "0.1.0"
description = "A reliability layer for N-ATLAS: guaranteed structured output and Nigerian-language normalization."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Elvis Preye Kerebi" }]
keywords = ["n-atlas", "nigeria", "llm", "structured-output", "yoruba", "hausa", "igbo"]

# The core package (normalization + budgeting) is pure stdlib — no runtime deps.
dependencies = []

[project.optional-dependencies]
# Only needed where the model actually runs (Kaggle/Colab/GPU host).
model = ["transformers>=4.44", "torch>=2.2"]
structured = ["outlines>=0.1.0"]
gateway = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gyara"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
